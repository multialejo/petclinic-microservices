# PetClinic - microservicios Laravel (infraestructura base)
#
# Orquestación propia (sin Laravel Sail). Cada microservicio se compone de:
#   - ms-<x>-app : PHP 8.4-FPM (imagen propia, ./ms-<x>/docker/Dockerfile)
#   - ms-<x>     : Nginx sidecar -> FastCGI a ms-<x>-app:9000 (hostname público en la red)
#   - db-<x>     : MySQL 8.4 propio (Database-per-Service)
# Todos comparten la red bridge `petclinic`; entre servicios se usa http://ms-<x>.
#
# Punto de entrada público:
#   - gateway    : Nginx (./gateway/nginx.conf) en el puerto 8000 -> enruta /api/* a cada ms-<x>
#
# Mensajería asíncrona (ms-visits):
#   - redis             : cola de eventos (VisitCreated)
#   - ms-visits-worker  : misma imagen que ms-visits-app ejecutando `php artisan queue:work`
#
# Secreto interno: INTERNAL_API_TOKEN se define una sola vez en el .env de la raíz y se inyecta
# como variable de entorno en todos los contenedores PHP (Laravel la prioriza sobre ms-*/.env).
#
# Frontend desacoplado:
#   - frontend-app : Laravel + Blade en PHP-FPM, SIN base de datos; solo llama a http://gateway
#   - frontend     : Nginx sidecar en el puerto 3000

x-php-app: &php-app
    environment:
        INTERNAL_API_TOKEN: '${INTERNAL_API_TOKEN:-}'
    extra_hosts:
        - 'host.docker.internal:host-gateway'
    networks:
        - petclinic

x-nginx: &nginx
    image: 'nginx:1.27-alpine'
    networks:
        - petclinic

x-mysql: &mysql
    image: 'mysql:8.4'
    networks:
        - petclinic
    healthcheck:
        test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
        interval: 5s
        retries: 10
        timeout: 5s

services:
    # ----------------------------------------------------------- Gateway
    # Sin depends_on a propósito: resuelve los upstreams en cada petición, así arranca y
    # sigue respondiendo (503 JSON en la ruta afectada) aunque algún ms-* esté apagado.
    gateway:
        <<: *nginx
        ports:
            - '${GATEWAY_PORT:-8000}:80'
        volumes:
            - './gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro'
        healthcheck:
            test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/health || exit 1']
            interval: 10s
            retries: 3
            timeout: 3s

    # -------------------------------------------------------------- Vets
    ms-vets-app:
        <<: *php-app
        build:
            context: ./ms-vets/docker
            args:
                HOST_UID: '${HOST_UID:-1000}'
                HOST_GID: '${HOST_GID:-1000}'
        image: petclinic/ms-vets:dev
        volumes:
            - './ms-vets:/var/www/html'
        depends_on:
            db-vets:
                condition: service_healthy

    ms-vets:
        <<: *nginx
        ports:
            - '${MS_VETS_PORT:-8001}:80'
        volumes:
            - './ms-vets/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro'
            - './ms-vets/public:/var/www/html/public:ro'
        depends_on:
            - ms-vets-app

    db-vets:
        <<: *mysql
        ports:
            - '${DB_VETS_PORT:-33061}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_VETS_ROOT_PASSWORD:-root_vets}'
            MYSQL_DATABASE: db_vets
            MYSQL_USER: vets
            MYSQL_PASSWORD: secret
        volumes:
            - 'db-vets-data:/var/lib/mysql'

    # --------------------------------------------------------- Customers
    ms-customers-app:
        <<: *php-app
        build:
            context: ./ms-customers/docker
            args:
                HOST_UID: '${HOST_UID:-1000}'
                HOST_GID: '${HOST_GID:-1000}'
        image: petclinic/ms-customers:dev
        volumes:
            - './ms-customers:/var/www/html'
        depends_on:
            db-customers:
                condition: service_healthy

    ms-customers:
        <<: *nginx
        ports:
            - '${MS_CUSTOMERS_PORT:-8002}:80'
        volumes:
            - './ms-customers/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro'
            - './ms-customers/public:/var/www/html/public:ro'
        depends_on:
            - ms-customers-app

    db-customers:
        <<: *mysql
        ports:
            - '${DB_CUSTOMERS_PORT:-33062}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_CUSTOMERS_ROOT_PASSWORD:-root_customers}'
            MYSQL_DATABASE: db_customers
            MYSQL_USER: customers
            MYSQL_PASSWORD: secret
        volumes:
            - 'db-customers-data:/var/lib/mysql'

    # ------------------------------------------------------------ Visits
    ms-visits-app:
        <<: *php-app
        build:
            context: ./ms-visits/docker
            args:
                HOST_UID: '${HOST_UID:-1000}'
                HOST_GID: '${HOST_GID:-1000}'
        image: petclinic/ms-visits:dev
        volumes:
            - './ms-visits:/var/www/html'
        depends_on:
            db-visits:
                condition: service_healthy
            redis:
                condition: service_healthy

    # Consumidor de la cola Redis. queue:work mantiene el código en memoria:
    # tras cambiar jobs/listeners, `docker compose restart ms-visits-worker`.
    ms-visits-worker:
        <<: *php-app
        image: petclinic/ms-visits:dev
        command: ['php', 'artisan', 'queue:work', 'redis', '--sleep=1', '--tries=3', '--timeout=60']
        restart: unless-stopped
        volumes:
            - './ms-visits:/var/www/html'
        depends_on:
            ms-visits-app:
                condition: service_started
            db-visits:
                condition: service_healthy
            redis:
                condition: service_healthy

    ms-visits:
        <<: *nginx
        ports:
            - '${MS_VISITS_PORT:-8003}:80'
        volumes:
            - './ms-visits/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro'
            - './ms-visits/public:/var/www/html/public:ro'
        depends_on:
            - ms-visits-app

    db-visits:
        <<: *mysql
        ports:
            - '${DB_VISITS_PORT:-33063}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_VISITS_ROOT_PASSWORD:-root_visits}'
            MYSQL_DATABASE: db_visits
            MYSQL_USER: visits
            MYSQL_PASSWORD: secret
        volumes:
            - 'db-visits-data:/var/lib/mysql'

    # ---------------------------------------------------------- Frontend
    # Sin BD ni depends_on hacia los ms-*: todo pasa por el gateway, resuelto en cada petición.
    frontend-app:
        <<: *php-app
        build:
            context: ./frontend/docker
            args:
                HOST_UID: '${HOST_UID:-1000}'
                HOST_GID: '${HOST_GID:-1000}'
        image: petclinic/frontend:dev
        volumes:
            - './frontend:/var/www/html'

    frontend:
        <<: *nginx
        ports:
            - '${FRONTEND_PORT:-3000}:80'
        volumes:
            - './frontend/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro'
            - './frontend/public:/var/www/html/public:ro'
        depends_on:
            - frontend-app

    # ------------------------------------------------------------- Redis
    # Solo para colas (sin puerto publicado ni persistencia: un job pendiente se pierde si se borra
    # el contenedor, aceptable en desarrollo). Se depura con `docker compose exec redis redis-cli`.
    redis:
        image: 'redis:7-alpine'
        networks:
            - petclinic
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            retries: 10
            timeout: 3s

networks:
    petclinic:
        driver: bridge

volumes:
    db-vets-data:
    db-customers-data:
    db-visits-data:
