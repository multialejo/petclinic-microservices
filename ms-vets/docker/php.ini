[PHP]
memory_limit = 256M
post_max_size = 100M
upload_max_filesize = 100M
variables_order = EGPCS
expose_php = Off

[opcache]
opcache.enable = 1
opcache.enable_cli = 0
; Desarrollo: revalidar archivos en cada request (código montado como volumen)
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
