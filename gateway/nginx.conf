# API Gateway — PetClinic (Nginx 1.27). Diseño: docs/fase2/README.md §3, ADR-04/07/09/10.
#
#   /api/customers/{resto} -> http://ms-customers/api/{resto}   (se quita "customers/")
#   /api/vets[/...]        -> http://ms-vets/api/vets[/...]     (tal cual)
#   /api/visits[/...]      -> http://ms-visits/api/visits[/...] (tal cual)
#
# Este archivo se monta como /etc/nginx/conf.d/default.conf, es decir, dentro del bloque `http`.

# 20 req/s por IP de cliente, con ráfaga de 40 (ver limit_req más abajo).
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

# CORS: solo se aceptan orígenes locales (frontend en :3000 en la Fase 4). Para cualquier otro
# origen la variable queda vacía y Nginx no envía el header (add_header omite valores vacíos).
map $http_origin $cors_origin {
    default                                         "";
    "~^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$" $http_origin;
}

server {
    listen 80;
    server_name _;

    # DNS de Docker + variables en proxy_pass: los upstreams se resuelven en cada petición, no al arrancar.
    # Sin esto Nginx no arranca si un ms-* está apagado ("host not found in upstream") — ADR-10.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $ms_customers ms-customers;
    set $ms_vets      ms-vets;
    set $ms_visits    ms-visits;

    # ---------------------------------------------------------------- CORS
    # IMPORTANTE: todos los add_header viven aquí, a nivel server. Si una location define su propio
    # add_header, deja de heredar TODOS estos (comportamiento de Nginx) y se pierde CORS.
    add_header Access-Control-Allow-Origin  $cors_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Accept, X-Requested-With" always;
    add_header Access-Control-Max-Age       600 always;
    add_header Vary                         Origin always;
    add_header X-Request-Id                 $request_id always;

    # Preflight: se responde en el gateway, nunca llega a los servicios.
    if ($request_method = OPTIONS) { return 204; }

    # Laravel (HandleCors global, config por defecto) también emite Access-Control-*; si se dejaran pasar,
    # el navegador vería el header duplicado y rechazaría la respuesta. El gateway es la única fuente de CORS.
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Expose-Headers;
    proxy_hide_header Access-Control-Max-Age;
    proxy_hide_header Vary;

    # ---------------------------------------------------------- Rate limit
    # Aplica a las rutas proxificadas. Las locations que responden con `return` (/health, 404, @*) no se
    # limitan: `return` se ejecuta en la fase rewrite, antes de la fase en que actúa limit_req.
    limit_req zone=api burst=40 nodelay;
    limit_req_status 429;

    # ------------------------------------------------------ Proxy (común)
    # Definidos a nivel server; ninguna location declara proxy_set_header propio para no perder la herencia.
    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id      $request_id;
    proxy_set_header Accept            application/json;  # Laravel siempre responde JSON (también errores)
    proxy_set_header X-Internal-Token  "";                # una petición externa nunca trae el token interno
    proxy_connect_timeout 2s;
    proxy_read_timeout    10s;

    # Servicio caído o que no responde -> 503 JSON (contrato), no la página 502 HTML de Nginx.
    # Solo se interceptan estos códigos: los 404/422 de Laravel ya son JSON y pasan sin cambios.
    proxy_intercept_errors on;
    error_page 502 503 504 = @unavailable;
    error_page 429         = @rate_limited;

    # ------------------------------------------------------------- Rutas
    location /api/customers/ {
        rewrite ^/api/customers/(.*)$ /api/$1 break;
        proxy_pass http://$ms_customers;   # sin URI: se reenvía el $uri reescrito + query string
    }

    # Regex con (/|$) para no capturar /api/vetsXYZ ni /api/visitsXYZ.
    location ~ ^/api/vets(/|$) {
        proxy_pass http://$ms_vets;
    }

    location ~ ^/api/visits(/|$) {
        proxy_pass http://$ms_visits;
    }

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location @unavailable {
        default_type application/json;
        return 503 '{"message":"Service unavailable"}';
    }

    location @rate_limited {
        default_type application/json;
        return 429 '{"message":"Too Many Requests"}';
    }

    location / {
        default_type application/json;
        return 404 '{"message":"Not Found"}';
    }
}
