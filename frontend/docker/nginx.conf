server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # Resolver de Docker + variable: el upstream PHP-FPM se resuelve en cada petición. Si frontend-app se
    # recrea (nueva IP), el sidecar sigue funcionando sin reiniciarse (mismo criterio que el gateway, ADR-10).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream frontend-app:9000;

    charset utf-8;
    client_max_body_size 100M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass $php_upstream;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
